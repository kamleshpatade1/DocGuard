
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docguard"
version = "0.1.0"
description = "Automated documentation drift detection"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "markdown-it-py>=3.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
docguard = "docguard.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["docguard*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
